name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build strict documentation
        env:
          CALM_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          CALM_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CALM_REPO_NAME: ${{ github.repository }}
          CALM_EDIT_URI: edit/${{ github.event.repository.default_branch }}/docs/
        run: python -m mkdocs build --strict
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
